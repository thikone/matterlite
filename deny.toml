[advisories]
git-fetch-with-cli = true
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; inherited from Warp-derived framework code." },
    { id = "RUSTSEC-2024-0425", reason = "get-size is unmaintained; used by string-offset." },
    { id = "RUSTSEC-2024-0427", reason = "get-size-derive is an unmaintained dependency of get-size." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is an unmaintained dependency of get-size-derive." },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; should migrate to web-time." },
]

[licenses]
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only the published forks Warp's framework code depends on. Never the warp-terminal
# repository itself (see AGENTS.md).
allow-git = [
    "https://github.com/servo/core-foundation-rs",
    "https://github.com/warpdotdev/winit.git",
    "https://github.com/warpdotdev/cosmic-text.git",
    "https://github.com/warpdotdev/font-kit",
    "https://github.com/warpdotdev/dwrote-rs",
    "https://github.com/warpdotdev/rust-objc.git",
    "https://github.com/warpdotdev/pathfinder.git",
    "https://github.com/warpdotdev/mermaid-to-svg.git",
    "https://github.com/warpdotdev/notify",
]
