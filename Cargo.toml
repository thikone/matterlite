[workspace]
members = [
  "crates/asset_cache",
  "crates/asset_macro",
  "crates/command",
  "crates/fuzzy_match",
  "crates/ipynb_parser",
  "crates/languages",
  "crates/markdown_parser",
  "crates/matterlite",
  "crates/ml_editor",
  "crates/ml_logging",
  "crates/ml_themes",
  "crates/ml_workspace",
  "crates/settings",
  "crates/settings_value",
  "crates/settings_value_derive",
  "crates/string-offset",
  "crates/sum_tree",
  "crates/syntax_tree",
  "crates/ui_components",
  "crates/vim",
  "crates/virtual_fs",
  "crates/warp_core",
  "crates/warp_editor",
  "crates/warp_errors",
  "crates/warp_features",
  "crates/warp_files",
  "crates/warp_util",
  "crates/warpui",
  "crates/warpui_core",
  "crates/warpui_extras",
  "crates/watcher",
]
resolver = "2"

[workspace.package]
authors = ["MatterLite contributors"]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Local workspace crates.
asset_cache = { path = "crates/asset_cache" }
asset_macro = { path = "crates/asset_macro" }
command = { path = "crates/command" }
fuzzy_match = { path = "crates/fuzzy_match" }
ipynb_parser = { path = "crates/ipynb_parser" }
languages = { path = "crates/languages" }
markdown_parser = { path = "crates/markdown_parser" }
ml_editor = { path = "crates/ml_editor" }
ml_logging = { path = "crates/ml_logging" }
ml_themes = { path = "crates/ml_themes" }
ml_workspace = { path = "crates/ml_workspace" }
settings = { path = "crates/settings" }
settings_value = { path = "crates/settings_value", default-features = false }
settings_value_derive = { path = "crates/settings_value_derive" }
string-offset = { path = "crates/string-offset" }
sum_tree = { path = "crates/sum_tree" }
syntax_tree = { path = "crates/syntax_tree" }
ui_components = { path = "crates/ui_components" }
vim = { path = "crates/vim" }
virtual-fs = { path = "crates/virtual_fs" }
warp_core = { path = "crates/warp_core" }
warp_editor = { path = "crates/warp_editor" }
warp_errors = { path = "crates/warp_errors" }
warp_features = { path = "crates/warp_features" }
warp_files = { path = "crates/warp_files" }
warp_util = { path = "crates/warp_util" }
warpui = { path = "crates/warpui" }
warpui_core = { path = "crates/warpui_core" }
warpui_extras = { path = "crates/warpui_extras", default-features = false }
watcher = { path = "crates/watcher" }

# Third-party dependencies. Versions follow Warp's workspace at the reference commit unless
# MatterLite needs something else.
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false }
arborium = { version = "2", default-features = false, features = [
  "lang-rust",
  "lang-go",
  "lang-yaml",
  "lang-python",
  "lang-javascript",
  "lang-typescript",
  "lang-tsx",
  "lang-java",
  "lang-cpp",
  "lang-bash",
  "lang-c-sharp",
  "lang-html",
  "lang-css",
  "lang-c",
  "lang-json",
  "lang-jq",
  "lang-hcl",
  "lang-lua",
  "lang-nix",
  "lang-ruby",
  "lang-php",
  "lang-toml",
  "lang-swift",
  "lang-kotlin",
  "lang-scala",
  "lang-powershell",
  "lang-elixir",
  "lang-sql",
  "lang-starlark",
  "lang-objc",
  "lang-xml",
  "lang-vue",
  "lang-dockerfile",
  "lang-markdown",
] }
arrayvec = "0.7.4"
async-broadcast = "0.7.2"
async-channel = "2.3.1"
async-compat = "0.2.5"
async-fs = "2.1.2"
async-io = "2.4.0"
async-process = "2.3.0"
async-task = "4.2.0"
base64 = "0.22"
block = "0.1.6"
blocking = "1.6.2"
bounded-vec-deque = "0.1"
bytemuck = { version = "1.13.1" }
bytes = { version = "1.11.1", features = ["serde"] }
cfg-if = "1.0.0"
cfg_aliases = "0.2.1"
chrono = { version = "0.4.38", features = ["serde"] }
cocoa = "=0.26.0"
concat-idents = "1.1.4"
core-foundation = "0.10.1"
ctrlc = "3.4.7"
dashmap = "6.1.0"
derivative = "2.2.0"
derive_more = "0.99.17"
directories = "6.0"
dirs = "6.0.0"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "block2"] }
dunce = "1.0.1"
enum-iterator = "1.1.3"
env_logger = "0.10.0"
event-listener = "5.4.0"
float-cmp = "0.9.0"
font-kit = { git = "https://github.com/warpdotdev/font-kit", rev = "a04b225ecb639bb850f21d05212cfdc7465000f3", default-features = false, features = [
  "source",
] }
futures = { version = "0.3", features = ["executor", "thread-pool"] }
futures-lite = "1.13.0"
futures-util = { version = "0.3", default-features = false }
get-size = { version = "0.1.4", features = ["derive"] }
getset = "0.1.1"
hex = "0.4.3"
html5ever = "0.35.0"
http = "1.1.0"
image = { version = "0.25.9", default-features = false, features = [
  "rayon",
  "jpeg",
  "png",
  "gif",
  "webp",
] }
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
inventory = "0.3.20"
itertools = "0.14.0"
lazy_static = "1.4.0"
libc = "0.2.81"
libtest-mimic = "0.8.2"
line-ending = "1.4.0"
log = { version = "0.4", features = ["serde", "std"] }
mermaid_to_svg = { git = "https://github.com/warpdotdev/mermaid-to-svg.git", rev = "8d3f789c2eb49335d7bf247a06bb649f59b6d4ed" }
mime_guess = "2.0"
minimp4 = "0.1.2"
nix = { version = "0.26.4", default-features = false, features = ["signal"] }
nom = "7.1.1"
notify-debouncer-full = { git = "https://github.com/warpdotdev/notify", rev = "91b719849bc04ef251bcb2cc61076b099204e970" }
num-traits = "0.2"
objc = "0.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
openh264 = "0.8"
ordered-float = { version = "3.0.0", features = ["serde"] }
parking_lot = "0.12.1"
pathfinder_color = "0.5"
pathfinder_geometry = "0.5.1"
pin-project = "1.0.10"
rand = "0.8.6"
rangemap = "1.3.0"
rayon = "1.10.0"
regex = "1.11.1"
reqwest = { version = "0.13", features = [
  "blocking",
  "brotli",
  "gzip",
  "form",
  "json",
  "multipart",
  "query",
  "stream",
] }
resvg = "0.47.0"
rust-embed = { version = "8.7.0", features = ["include-exclude"] }
rustc-hash = "2.1.1"
rustls = "0.23.39"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.8"
sha2 = "0.10"
similar = { version = "2.7", features = ["inline"] }
simplelog = "0.12.2"
smallvec = "1.6.1"
streaming-iterator = "0.1.0"
strum = "0.27"
strum_macros = "0.27"
tempfile = "3.8.0"
thiserror = "2.0.17"
tokio = "1.47.1"
toml_edit = "0.25.5"
tracing = "0.1.40"
typed-path = "0.10.0"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.11.0"
unicode-width = "0.1.12"
url = "2.5.4"
urlocator = "0.1.4"
vec1 = { version = "1.8.0", features = ["serde"] }
version-compare = "0.1"
wgpu = { version = "30.0.0", default-features = false, features = [
  "dx12",
  "gles",
  "metal",
  "parking_lot",
  "std",
  "vulkan",
  "wgsl",
] }
windows = { version = "0.62.2", features = [
  "Win32",
  "Win32_System",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Wdk_System",
  "Wdk_System_SystemServices",
  "Win32_System_Com",
  "Win32_System_SecurityCenter",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
] }
windows-core = { version = "0.62.2" }
winit = { git = "https://github.com/warpdotdev/winit.git", rev = "a4e0ecb5f9626ccac9445a73dc28354b52423abc" }
winreg = "0.55.0"
x11rb = "0.13.0"
zbus = "5.9.0"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package]
# Font, text layout and image decoding are unbearably slow unoptimized.
ttf-parser.opt-level = 3
fdeflate.opt-level = 3
image.opt-level = 3
png.opt-level = 3
miniz_oxide.opt-level = 3
memchr.opt-level = 3

[profile.release]
debug = 1
split-debuginfo = "packed"

[profile.release-lto]
inherits = "release"
lto = "thin"

# Short alias of release-lto: keeps Windows build paths below MAX_PATH. Used for releases.
[profile.rlto]
inherits = "release-lto"
strip = "symbols"

[patch.crates-io]
# Fixes a CoreText font-descriptor leak not yet in a crates.io release (servo/core-foundation-rs#746).
core-foundation = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
core-foundation-sys = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
core-graphics = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
core-text = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
# Warp's forks used by the macOS platform layer and the renderer.
objc = { git = "https://github.com/warpdotdev/rust-objc.git", rev = "5b656827fa9f863ef0eb22e444a3fedac009e78a" }
pathfinder_simd = { git = "https://github.com/warpdotdev/pathfinder.git", rev = "34128a129ca6aee168fbc5060a4f21b4f7e486a9" }
