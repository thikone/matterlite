[package]
name = "warp_errors"
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Built-in ErrorExt classifications for common third-party error types. Kept optional so leaf
# crates that only need report_error! don't pull these heavier dependencies.
reqwest-errors = ["dep:reqwest", "dep:http"]
tokio-errors = ["dep:tokio"]

[dependencies]
anyhow.workspace = true
log.workspace = true
inventory.workspace = true
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
