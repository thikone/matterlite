[package]
name = "warpui_extras"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["secure_storage", "user_preferences", "user_preferences-file", "user_preferences-toml"]
secure_storage = ["dep:security-framework", "dep:secret-service", "dep:ouroboros"]
test-util = []
user_preferences = ["dep:serde", "dep:serde_json", "dep:toml_edit"]
# Kept as aliases so dependants can name the store they rely on.
user_preferences-file = ["user_preferences"]
user_preferences-toml = ["user_preferences"]

[dependencies]
warp_errors.workspace = true
anyhow.workspace = true
log.workspace = true
async-channel.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
toml_edit = { workspace = true, optional = true }
thiserror.workspace = true
warpui_core.workspace = true

[dev-dependencies]
warpui_extras = { path = ".", features = ["test-util"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "2.0.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ouroboros = { version = "0.18", optional = true }
rand = "0.8.5"
ring = "0.17.13"
secret-service = { version = "5.0.0", features = ["rt-async-io-crypto-rust"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Cryptography", "Win32_UI_Shell"] }
