[package]
name = "mm_cache"
version = "0.1.0"
description = "SQLite cache of a Mattermost account: schema, batched writer thread, hydration, message search"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diesel = { workspace = true, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Bundled SQLite (with FTS5) on every platform; no system library needed.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
log.workspace = true
mm_model.workspace = true
mm_store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
