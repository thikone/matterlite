name: presubmit

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash script/provenance

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Only this repository is checked out, so a hidden dependency on the Warp reference
      # checkout fails here.
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev clang
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Compiler and clippy messages become annotations on the run and the diff.
      - run: echo "::add-matcher::.github/matchers/rust.json"
      - run: cargo fmt --all -- --check
      # --keep-going: one failing crate doesn't hide the errors in the others.
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo test --workspace --no-fail-fast
