name: build

# Portable archives for each platform (MatterLite.md §16), built by script/build-portable.*.
# Pushes to main build development archives (v<version>-dev.<commit>), kept as run artifacts.
# A pushed tag v<semver> builds that release and publishes the archives as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          # The oldest supported Ubuntu sets the glibc baseline (MatterLite.md §15.1).
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev clang
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: echo "::add-matcher::.github/matchers/rust.json"
      - name: Release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=" >> "$GITHUB_ENV"
          fi
      - name: Build the portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:TAG) { ./script/build-portable.ps1 -Tag $env:TAG } else { ./script/build-portable.ps1 }
      - name: Build the portable archive
        if: runner.os != 'Windows'
        run: script/build-portable.sh $TAG
      - uses: actions/upload-artifact@v4
        with:
          name: matterlite-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $prerelease \
            --title "MatterLite $GITHUB_REF_NAME" \
            --notes "Portable archives: unpack and run. The data folder next to the program keeps settings, cache and logs; delete it to use the per-user folders instead. Unsigned: Windows SmartScreen and macOS Gatekeeper warn on first start." \
            *
